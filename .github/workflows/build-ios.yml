
name: Build Morrowind for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install cmake ninja autoconf automake libtool pkg-config

      - name: Clone OpenMW iOS source
        run: |
          git clone https://gitlab.com/duron27/openmw_ios.git source

      - name: Check source files
        working-directory: source
        run: |
          ls -la
          test -f scripts/bootstrap.sh
          test -f scripts/build-ios.sh

      - name: Bootstrap dependencies
        working-directory: source
        run: |
          chmod +x scripts/*.sh
          set -o pipefail
          ./scripts/bootstrap.sh 2>&1 | tee ../bootstrap.log

      - name: Build iOS project
        working-directory: source
        run: |
          set -o pipefail
          ./scripts/build-ios.sh 2>&1 | tee ../ios-build.log

      - name: Check generated Xcode project
        working-directory: source
        run: |
          xcodebuild -list \
            -project build/ios/OpenMW.xcodeproj

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Morrowind-iOS-diagnostics
          path: |
            bootstrap.log
            ios-build.log
            source/build/
          if-no-files-found: warn
