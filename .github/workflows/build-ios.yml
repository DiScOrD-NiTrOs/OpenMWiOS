
name: Build Morrowind for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone OpenMW iOS
        run: |
          git clone https://gitlab.com/duron27/openmw_ios.git source

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check tools
        run: |
          xcodebuild -version
          cmake --version
          java -version

      - name: Check project files
        working-directory: source
        run: |
          ls -la
          ls -la scripts || true
          find . -maxdepth 3 -name '*.xcodeproj' -o -name 'build-ios.sh'

      - name: Build iOS
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:buildNativeIosDevice --stacktrace --info

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: source/composeApp/build/
          if-no-files-found: warn
