
name: Build Morrowind for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout OpenMWiOS
        uses: actions/checkout@v5

      - name: Prepare logs
        run: mkdir -p logs

      - name: Check project
        run: |
          ls -la
          ls -la scripts
          test -f scripts/bootstrap.sh
          test -f scripts/build-ios.sh

      - name: Install dependencies
        run: |
          brew install cmake ninja autoconf automake libtool pkg-config

      - name: Bootstrap
        run: |
          chmod +x scripts/bootstrap.sh
          set -o pipefail
          ./scripts/bootstrap.sh 2>&1 | tee logs/bootstrap.log

      - name: Build iOS
        run: |
          chmod +x scripts/build-ios.sh
          set -o pipefail
          ./scripts/build-ios.sh 2>&1 | tee logs/build-ios.log

      - name: Inspect generated project
        if: success()
        run: |
          ls -la build/ios
          xcodebuild -list \
            -project build/ios/OpenMW.xcodeproj

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Morrowind-build-diagnostics
          path: |
            logs/
            build/ios/
          if-no-files-found: warn
          retention-days: 7
